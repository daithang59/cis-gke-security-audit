name: "Task / Tính năng mới"
description: "Tạo nhiệm vụ hoặc hạng mục công việc phát triển trong dự án"
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ### Biểu mẫu khởi tạo Task cho dự án CIS GKE Security Audit
        Vui lòng điền đầy đủ các thông tin bên dưới để phân định rõ vai trò và tiêu chí nghiệm thu.
  - type: dropdown
    id: role
    attributes:
      label: Vai trò phụ trách chính
      description: Thành viên chịu trách nhiệm chính về sản phẩm bàn giao của task này.
      options:
        - "Role A (Cloud & Integration Lead: Terraform, Cloud Collector, CI/WIF)"
        - "Role B (Python Audit & Reporting Lead: Engine, K8s Collector, CLI, Rules 4.1.x, Reporter)"
        - "Role C (CIS Security, Labs & QA Lead: CIS Matrix, Rules 4.2.x/4.3.x, Labs, QA)"
        - "Phối hợp liên vai trò (Cross-role collaboration)"
    validations:
      required: true
  - type: dropdown
    id: gke_mode
    attributes:
      label: Chế độ cụm GKE áp dụng
      description: Task này tác động tới chế độ GKE nào?
      options:
        - "Cả Standard và Autopilot"
        - "Chỉ GKE Standard"
        - "Chỉ GKE Autopilot"
        - "Không áp dụng (Hạ tầng chung, CI, Docs)"
    validations:
      required: true
  - type: checkboxes
    id: cis_controls
    attributes:
      label: CIS Controls P0 liên quan
      description: Chọn các control có liên quan trực tiếp đến task này.
      options:
        - label: "4.1.4 - Ensure default ServiceAccount is not used by workloads (Level 1 · Automated)"
        - label: "4.1.5 - Ensure SA token is only mounted when workload requires API (Level 1 · Manual)"
        - label: "4.1.9 - Ensure custom RBAC is not granted to system:authenticated (Level 1 · Automated)"
        - label: "4.2.1 - Ensure PSS baseline/restricted is enforced (Standard Level 1 · Manual)"
        - label: "4.3.1 - Evaluate NetworkPolicy enforcement mechanism (Standard L1 / Autopilot L2 · Manual)"
        - label: "4.3.2 - Ensure default-deny NetworkPolicy is enforced (Standard Level 2 · Automated)"
        - label: "Không liên quan trực tiếp đến 6 P0 controls"
  - type: textarea
    id: description
    attributes:
      label: Mô tả chi tiết công việc
      description: Mô tả bối cảnh, mục tiêu kỹ thuật và giải pháp dự kiến.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Tiêu chuẩn nghiệm thu (Acceptance Criteria)
      description: Các điều kiện cụ thể để coi task này hoàn thành.
      value: |
        - [ ] Mã nguồn hoặc tài liệu đã hoàn thành theo yêu cầu.
        - [ ] Đã bổ sung unit tests / fixtures tương ứng.
        - [ ] `ruff check .` và `pytest` đều PASS trên môi trường cục bộ.
        - [ ] Được review chéo bởi ít nhất 1 thành viên liên quan khác.
    validations:
      required: true
  - type: textarea
    id: dependencies_risks
    attributes:
      label: Phụ thuộc & Đánh giá rủi ro
      description: Task này phụ thuộc vào module của ai (A, B hay C)? Có rủi ro gì về schema hoặc chi phí không?
      placeholder: "Ví dụ: B phụ thuộc vào schema Cloud response của A; Có rủi ro thay đổi format `docs/contracts.md`..."
    validations:
      required: false

